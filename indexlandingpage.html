  -->

  <!-- Geist Sans (same family family used on modern AI product sites like Godela) -->

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }
    html, body {
      background: #000;
      color: #fafafa;
      font-family: 'Geist Sans', Geist, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; background: #000; }

    /* First slide = exact full viewport (no 92vh gap / bottom margin strip) */
    .hero-full {
      min-height: 100vh;
      min-height: 100dvh;
      height: 100vh;
      height: 100dvh;
    }

    /* Godela-like: soft radial glow, not heavy liquid glass */
    .hero-glow {
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(124, 106, 247, 0.16) 0%, transparent 55%),
        radial-gradient(ellipse 40% 30% at 90% 40%, rgba(0, 217, 168, 0.05) 0%, transparent 50%),
        #050505;
    }

    .section-num {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.75rem;
      font-weight: 500;
    }

    .h-display {
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .link-arrow {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.15s ease, gap 0.15s ease;
    }
    .link-arrow:hover { opacity: 0.85; gap: 0.55rem; }

    .card-quiet {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
      border-radius: 1rem;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .card-quiet:hover {
      border-color: rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.035);
    }

    .card-invert {
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 1rem;
      transition: background 0.25s ease, border-color 0.25s ease, backdrop-filter 0.25s ease;
    }
    .card-invert:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .nav-blur {
      background: rgba(5, 5, 5, 0.42);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }
    /* Over slide-2 wallpaper — lighter frost so header doesn’t go murky dark */
    .nav-blur.nav-on-slide2 {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        0 8px 32px rgba(0, 0, 0, 0.12);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #fafafa;
      color: #0a0a0a;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.7rem 1.15rem;
      border-radius: 9999px;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .btn-primary:hover { background: #e8e8e8; }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: rgba(255, 255, 255, 0.75);
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.7rem 1.15rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .btn-ghost:hover {
      border-color: rgba(255, 255, 255, 0.28);
      color: #fff;
    }

    /*
      Same phone math as space-landing/index.html:
      9/16 frame · hairline chrome · L/R crop via wider video · slight bottom crop.
      object-position nudged down so green S2S + white toggle stay fully on-screen.
    */
    .ava-stage {
      position: relative;
      width: min(290px, 70vw);
      flex-shrink: 0;
    }
    .ava-phone-chrome {
      border-radius: 1.45rem;
      padding: 1px;
      background: rgba(255, 255, 255, 0.08);
    }
    .ava-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 1.35rem;
      overflow: hidden;
      background: #000;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 28px 90px rgba(0, 0, 0, 0.6),
        0 0 70px rgba(124, 106, 247, 0.18);
    }
    /*
      ava-talk.mp4 frame: status/recording bar sits above purple Synapses chrome.
      Crop ONLY that strip (~4–5% of source height). Do not push past the purple header.
      Side crop still kills L/R black gutters; green S2S + white toggle stay in view.
    */
    .ava-frame video {
      position: absolute;
      left: 50%;
      top: 0;
      width: 118%;
      height: 112%;
      /* -4.5% shifts status bar out; purple logo row remains */
      transform: translate(-50%, -4.5%);
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .ava-mute-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 5;
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .ava-mute-btn:hover {
      background: rgba(0, 0, 0, 0.72);
      border-color: rgba(255, 255, 255, 0.32);
    }
    .ava-mute-hint {
      margin-top: 6px;
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      font-weight: 500;
    }

    /* Deep-space aurora — scoped banner behind the Companion section.
       #companion also carries Tailwind's "relative overflow-hidden" classes;
       these plain rules are a fallback so the stacking still works even if
       the Tailwind CDN is slow/unavailable when the page first paints. */
    #companion {
      position: relative;
      overflow: hidden;
    }
    #deepSpaceLayer {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: #000;
      opacity: 1;
    }
    #deepSpaceLayer canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Match index: copy + phone as one centered cluster */
    .ava-hero-cluster {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
    }
    @media (min-width: 900px) {
      .ava-hero-cluster {
        flex-direction: row;
        align-items: center;
        gap: 2rem;
      }
    }
    .ava-hero-copy {
      flex: 1 1 auto;
      max-width: 380px;
      text-align: center;
    }
    @media (min-width: 900px) {
      .ava-hero-copy { text-align: left; }
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    }

    /*
      Godela-inspired scroll reveals — soft, sequential, not flashy.
      Items rise + fade once when they enter the viewport.
    */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      filter: blur(6px);
      transition:
        opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      transition-delay: var(--reveal-delay, 0ms);
      will-change: opacity, transform, filter;
    }
    .reveal.is-in {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
    .reveal-from-left {
      transform: translateX(-20px) translateY(12px);
    }
    .reveal-from-left.is-in {
      transform: translateX(0) translateY(0);
    }
    .reveal-from-right {
      transform: translateX(20px) translateY(12px);
    }
    .reveal-from-right.is-in {
      transform: translateX(0) translateY(0);
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal {
        opacity: 1;
        transform: none;
        filter: none;
        transition: none;
      }
    }

    /* ---- Research section (OpenAI-style editorial) ---- */
    .research-quote {
      font-family: 'Geist Sans', Geist, ui-sans-serif, system-ui, sans-serif;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.92);
    }
    .research-spectrum {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.75rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.01em;
    }
    .research-spectrum span.step {
      color: rgba(255, 255, 255, 0.85);
    }
    .research-spectrum span.sep {
      color: rgba(255, 255, 255, 0.25);
    }
    .research-index-row {
      display: grid;
      grid-template-columns: 3.25rem 1fr;
      align-items: baseline;
      gap: 0.25rem 1.25rem;
      padding: 1.35rem 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-decoration: none;
      cursor: default;
      transition: padding-left 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .research-index-row:last-child {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .research-index-row:hover {
      padding-left: 0.5rem;
    }
    @media (min-width: 768px) {
      .research-index-row {
        grid-template-columns: 4.5rem 1fr;
      }
    }
    .research-index-num {
      font-family: 'Geist Sans', Geist, ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.18);
      transition: color 0.3s ease;
      font-variant-numeric: tabular-nums;
    }
    .research-index-row:hover .research-index-num {
      color: #7c6af7;
    }
    .research-index-body {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 0.6rem;
      row-gap: 0.15rem;
    }
    .research-index-title {
      font-size: 1.05rem;

      color: rgba(255, 255, 255, 0.9);
      white-space: nowrap;
      transition: color 0.3s ease;
    }
    .research-index-row:hover .research-index-title {
      color: #ffffff;
    }
    .research-index-q {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      line-height: 1.5;
    }
    @media (max-width: 500px) {
      .research-index-row { grid-template-columns: 2.5rem 1fr; }
      .research-index-title { white-space: normal; }
    }
    .principle-row {
      display: flex;
      gap: 0.9rem;
      padding: 1.25rem 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    @media (min-width: 768px) {
      .principle-row {
        padding: 1.4rem 0;
      }
    }
    .principle-numeral {
      font-family: 'Geist Sans', Geist, ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      color: rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }
    .principle-title {
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: #fafafa;
    }
    .principle-body {
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.6;
    }
    /* Capabilities grid */
    .capability-col {
      padding: 0 0 0 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1.5rem;
    }
    @media (min-width: 768px) {
      .capability-col {
        border-top: none;
        border-left: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 0;
        padding-left: 1.5rem;
      }
    }
    .capability-letter {
      font-family: 'Geist Sans', Geist, ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: #7c6af7;
    }
    .capability-title {
      margin-top: 0.6rem;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: #fafafa;
      font-size: 1rem;
    }
    .capability-body {
      margin-top: 0.5rem;
      color: rgba(255, 255, 255, 0.45);
      font-size: 13px;
      line-height: 1.6;
    }
    /* Research notes */
    .note-card {
      display: block;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1.75rem 0;
      text-decoration: none;
      transition: padding-left 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .note-card:last-child {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .note-card:hover {
      padding-left: 0.5rem;
    }
    .note-meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
    }
    .note-meta .dot {
      width: 3px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.3);
    }
    .note-title {
      margin-top: 0.6rem;
      font-family: 'Geist Sans', Geist, ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: #fafafa;
      font-size: 1.15rem;
      transition: color 0.3s ease;
    }
    .note-card:hover .note-title {
      color: #a599ff;
    }
    .note-body {
      margin-top: 0.5rem;
      color: rgba(255, 255, 255, 0.45);
      font-size: 13.5px;
      line-height: 1.6;
      max-width: 34rem;
    }
    .note-arrow {
      display: inline-flex;
      margin-top: 0.9rem;
      align-items: center;
      gap: 0.4rem;
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
    }
    .note-card:hover .note-arrow {
      color: #a599ff;
    }
    /* ---- Lab stats (network scene itself now lives inside the Sylva iframe) ---- */
    .lab-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1.5rem;
    }
    @media (min-width: 768px) {
      .lab-stats { grid-template-columns: repeat(4, 1fr); }
    }
    .lab-stat-num {
      font-family: 'Geist Sans', Geist, ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      color: #fafafa;
    }
    .lab-stat-label {
      margin-top: 0.3rem;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.01em;
    }
    /* Moss/flora scene ("grown, not built") — purple path three.js
       scene, lazy-loaded via iframe ./OPEN-THIS-purple-path.html */
    .sylva-scene-wrap {
      position: relative;
      width: 100%;
      height: 82vh;
      min-height: 520px;
      max-height: 820px;
      border-radius: 1.25rem;
      overflow: hidden;
      background: #4a4d44;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .sylva-scene-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      display: block;
      border: 0;
      background: #4a4d44;
      transition: opacity 0.6s ease;
    }
    .sylva-scene-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.4);
    }
    .flora-overlay-copy {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 1.5rem 1.75rem 1.35rem;
      background: linear-gradient(180deg, transparent 0%, rgba(3, 5, 4, 0.65) 65%, rgba(3, 5, 4, 0.88) 100%);
      pointer-events: none;
      font-size: 11.5px;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.45);
    }
    /* Findings grid */
    .finding-card {
      position: relative;
      display: block;
      border-radius: 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.015);
      text-decoration: none;
      overflow: hidden;
      transition: border-color 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease;

    .finding-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.035);
      transform: translateY(-3px);
    }
    .finding-card-body {
      position: relative;
      padding: 1.5rem 1.5rem 1.6rem;
    }
    .finding-accent {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      opacity: 0.7;
    }
    /* Photo header */
    .finding-photo {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }
    .finding-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5,5,5,0) 45%, rgba(5,5,5,0.85) 100%);
    }
    .finding-photo-tag {
      position: absolute;
      left: 1.1rem;
      bottom: 0.9rem;
      z-index: 1;
      display: inline-flex;

      gap: 0.4rem;
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      background: rgba(8, 8, 12, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
    }
    .finding-photo-credit {
      position: absolute;
      right: 0.7rem;
      bottom: 0.6rem;
      z-index: 1;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.01em;
    }
    .finding-card.has-photo .finding-card-body { padding-top: 1.15rem; }
    .finding-meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
    }
    .finding-meta .dot {
      width: 3px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.3);
    }
    .finding-title {
      margin-top: 0.85rem;
      font-family: 'Geist Sans', Geist, ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: #fafafa;
      font-size: 1.02rem;
      line-height: 1.35;
      transition: color 0.3s ease;
    }
    .finding-card:hover .finding-title { color: #a599ff; }
    .finding-body {
      margin-top: 0.55rem;
      color: rgba(255, 255, 255, 0.45);
      font-size: 13px;
      line-height: 1.6;
    }
    .finding-arrow {
      display: inline-flex;
      margin-top: 1.1rem;
      align-items: center;
      gap: 0.4rem;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);

    /**
     * Scroll reveal — Godela-style sequential load-in after the hero.
     * once: true keeps it calm (no re-animating on every scroll).
     */
    function Reveal({
      children,
      className = '',
      delay = 0,
      from = 'up', // 'up' | 'left' | 'right'
      as: Tag = 'div',
      threshold = 0.18,
    }) {
      const ref = useRef(null);
      const [inView, setInView] = useState(false);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          setInView(true);
          return;
        }
        const obs = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setInView(true);
              obs.disconnect();
            }
          },
          { threshold, rootMargin: '0px 0px -8% 0px' }
        );
        obs.observe(el);
        return () => obs.disconnect();
      }, [threshold]);

      const fromClass =
        from === 'left' ? 'reveal-from-left' : from === 'right' ? 'reveal-from-right' : '';

      return (
        <Tag
          ref={ref}
          className={`reveal ${fromClass} ${inView ? 'is-in' : ''} ${className}`}
          style={{ '--reveal-delay': `${delay}ms` }}
        >
          {children}
        </Tag>
      );
    }

    // Scroll-scrubbed text: words are dim by default and brighten in sequence
    // as the paragraph passes through a reveal band in the viewport while scrolling.
    function LitText({ text, className = '', as: Tag = 'p', minOpacity = 0.22, maxOpacity = 1 }) {
      const ref = useRef(null);
      const [progress, setProgress] = useState(0);
      const words = text.split(' ');

      useEffect(() => {
        const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) {
          setProgress(1);
          return;
        }
        let raf = null;
        const compute = () => {
          const el = ref.current;
          if (!el) return;
          const rect = el.getBoundingClientRect();
          const vh = window.innerHeight || 800;
          const start = vh * 0.9;
          const end = vh * 0.34;
          let raw = (start - rect.top) / (start - end);
          // Trailing sections near the end of the page (e.g. the final CTA) may
          // never reach the normal reveal threshold since there's no more room
          // left to scroll — force a full reveal once we hit the page bottom.
          const doc = document.documentElement;
          const atBottom = window.innerHeight + window.scrollY >= doc.scrollHeight - 4;
          if (atBottom) raw = 1;
          setProgress(Math.min(1, Math.max(0, raw)));
        };
        const onScroll = () => {
          if (raf) return;
          raf = requestAnimationFrame(() => {
            compute();
            raf = null;
          });
        };
        compute();
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);
        return () => {
          window.removeEventListener('scroll', onScroll);
          window.removeEventListener('resize', onScroll);
          if (raf) cancelAnimationFrame(raf);
        };
      }, []);

      return (
        <Tag ref={ref} className={`lit-text ${className}`}>
          {words.map((w, i) => {
            const t = words.length > 1 ? i / (words.length - 1) : 0;
            const local = Math.min(1, Math.max(0, (progress - t * 0.72) / 0.28));
            return (
              <span key={i} className="lit-word" style={{ opacity: minOpacity + local * (maxOpacity - minOpacity) }}>
                {w}{i < words.length - 1 ? ' ' : ''}
              </span>
            );
          })}
        </Tag>
      );
    }

    // Typewriter: characters type themselves in once the element enters view.
    function Typewriter({ text, className = '', speed = 16, startDelay = 0, as: Tag = 'span' }) {
      const ref = useRef(null);
      const [inView, setInView] = useState(false);
      const [count, setCount] = useState(0);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          setInView(true);
          setCount(text.length);
          return;
        }
        const obs = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setInView(true);
              obs.disconnect();
            }
          },
          { threshold: 0.4 }
        );
        obs.observe(el);
        return () => obs.disconnect();
      }, [text]);

      useEffect(() => {
        if (!inView || count >= text.length) return;
        const delay = count === 0 ? startDelay + speed : speed;
        const id = setTimeout(() => setCount((c) => c + 1), delay);
        return () => clearTimeout(id);
      }, [inView, count, text, speed, startDelay]);

      return (
        <Tag ref={ref} className={`type-text ${className}`}>
          {text.slice(0, count)}
        </Tag>
      );
    }

            <div className="mt-20">
              <Reveal>
                <p className="text-[13px] font-medium text-white/40 tracking-wide uppercase mb-2">Research areas</p>
              </Reveal>
              <div className="mt-4">
                {areas.map((a, i) => (
                  <Reveal key={a.n} delay={40 + i * 45}>
                    <div className="research-index-row">
                      <span className="research-index-num">{String(i + 1).padStart(2, '0')}</span>
                      <span className="research-index-body">
                        <span className="research-index-title">{a.title}</span>
                        <span className="research-index-q">— {a.q}</span>
                      </span>
                    </div>
                  </Reveal>
                ))}
              </div>
            </div>

            {/* Philosophy (2-col, 3 rows each) + closing statement as a third column */}
            <div className="mt-24 grid grid-cols-1 lg:grid-cols-3 gap-x-14 gap-y-14">
              <div className="lg:col-span-2">
                <Reveal>
                  <p className="text-[13px] font-medium text-white/40 tracking-wide uppercase mb-2">Research philosophy</p>
                </Reveal>
                <div className="mt-4 grid grid-cols-1 md:grid-cols-2 md:gap-x-10">
                  {principles.map((p, i) => (
                    <Reveal key={p.title} delay={40 + i * 45}>
                      <div className="principle-row">
                        <span className="principle-numeral">{p.numeral}</span>
                        <div>
                          <h4 className="principle-title text-[14px] md:text-[15px]">{p.title}</h4>
                          <p className="principle-body text-[13px] mt-1 leading-relaxed">{p.body}</p>
                        </div>
                      </div>
                    </Reveal>
                  ))}
                </div>
              </div>

              <div className="lg:mt-9">
                <LitText
                  as="p"
                  className="h-display text-2xl sm:text-3xl md:text-4xl"
                  text="The next frontier of software may not be software at all. It may be intelligence."
                />
                <Reveal delay={120}>
                  <div className="mt-9 flex flex-wrap items-center gap-3">
                    <a href="research.html" className="btn-primary">
                      Read the research paper <Arrow />
                    </a>
                    <a href={APP.open} className="btn-ghost">
                      Explore Synapses
                    </a>
                  </div>
                </Reveal>
              </div>
            </div>

            {/* Capabilities — four-up editorial grid */}
            <div className="mt-24 md:mt-28 pt-14 md:pt-16 border-t border-white/[0.06]">
              <Reveal>
                <p className="text-[13px] font-medium text-white/40 tracking-wide uppercase mb-2">Capabilities</p>
              </Reveal>
              <Reveal delay={60}>
                <h3 className="h-display text-2xl sm:text-3xl md:text-[2.25rem] max-w-2xl text-white">
                  What that research looks like once it's running.
                </h3>
              </Reveal>

              <div className="mt-12 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-8 gap-y-10">
                {capabilities.map((c, i) => (
                  <Reveal key={c.letter} delay={60 + i * 60}>
                    <div className="capability-col">
                      <span className="capability-letter">{c.letter}</span>
                      <p className="capability-title">{c.title}</p>
                      <p className="capability-body">{c.body}</p>
                    </div>
                  </Reveal>
                ))}
              </div>
            </div>

            {/* Research notes — editorial feed */}
            <div className="mt-24 md:mt-28 pt-14 md:pt-16 border-t border-white/[0.06]">
              <div className="flex items-end justify-between gap-6 flex-wrap">
                <div>
                  <Reveal>
                    <p className="text-[13px] font-medium text-white/40 tracking-wide uppercase mb-2">Research notes</p>
                  </Reveal>
                  <Reveal delay={60}>
                    <h3 className="h-display text-2xl sm:text-3xl md:text-[2.25rem] max-w-xl text-white">
                      Working notes from the lab, as they happen.
                    </h3>
                  </Reveal>
                </div>
                <Reveal delay={100}>
                  <a href="research.html" className="btn-ghost !py-2 !px-4 text-[13px] flex-shrink-0">
                    All research <Arrow />
                  </a>
                </Reveal>
              </div>

              <div className="mt-10">
                {notes.map((note, i) => (
                  <Reveal key={note.title} delay={80 + i * 70}>
                    <a href="research.html" className="note-card">
                      <div className="note-meta">
                        <span>{note.tag}</span>
                        <span className="dot" />
                        <span>{note.date}</span>
                      </div>
                      <p className="note-title">{note.title}</p>
                      <p className="note-body">{note.body}</p>
                      <span className="note-arrow">Read note <Arrow /></span>
                    </a>
                  </Reveal>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    // Combined "living memory" section: the real Sylva/inner-green three.js
    // scene (moss branch, ferns, butterfly) with the network-graph nodes
    // now mounted inside that same scene's freed-up middle space, plus the
    // supporting stats and the research findings feed underneath. One
    // section, one heading, instead of two separate scenes.
    function SylvaHero() {
      const [ready, setReady] = useState(false);
      const [shouldLoad, setShouldLoad] = useState(false);
      const wrapRef = useRef(null);

      useEffect(() => {
        const wrap = wrapRef.current;
        if (!wrap) return;
        if (typeof IntersectionObserver === 'undefined') {
          setShouldLoad(true);
          return;
        }
        const io = new IntersectionObserver((entries) => {
          if (entries.some((e) => e.isIntersecting)) {
            setShouldLoad(true);
            io.disconnect();
          }
        }, { rootMargin: '280px 0px' });
        io.observe(wrap);
        return () => io.disconnect();
      }, []);

      useEffect(() => {
        const onMsg = (e) => { if (e && e.data === 'sylva-ready') setReady(true); };
        window.addEventListener('message', onMsg);
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const stats = [
        { num: '8', label: 'Active threads' },
        { num: '24/7', label: 'Continuous eval loop' },
        { num: 'Weekly', label: 'Shipping cadence' },
        { num: '0', label: 'Meetings about meetings' },
      ];

      const findings = [
        {
          tag: 'Safety', date: 'Apr 2026', title: 'Where the ask-first line actually sits',
          body: 'A working log of the situations that moved autonomy back toward asking permission \u2014 and the conversation that changed our minds.',
          color: '#7c6af7', featured: true,
          img: 'https://images.unsplash.com/photo-1758873268998-2f77c2d38862?q=80&w=1600&auto=format&fit=crop',
          credit: 'Vitaly Gariev / Unsplash',
        },
        {
          tag: 'Memory', date: 'Aug 2026', title: 'Compression without amnesia',
          body: 'How much of a conversation can be summarized before the parts that mattered quietly disappear.',
          color: '#7c6af7',
          img: 'https://images.unsplash.com/photo-1744555270794-6d378b9e7cd3?q=80&w=1200&auto=format&fit=crop',
          credit: 'Ilham Malik / Unsplash',
        },
        {
          tag: 'Voice', date: 'Jul 2026', title: 'The half-second that makes it feel real',
          body: 'Latency budget notes: where the extra milliseconds went, and which ones we got back.',
          color: '#00d9a8',
          img: 'https://images.unsplash.com/photo-1753715613434-9c7cb58876b9?q=80&w=1200&auto=format&fit=crop',
          credit: 'Jakub \u017berdzicki / Unsplash',
        },
        {
          tag: 'Perception', date: 'May 2026', title: 'Context without a camera',
          body: 'What tone, pacing, and word choice can tell a system that pixels never could.',
          color: '#00d9a8',
          img: 'https://images.unsplash.com/photo-1672924030487-90829105b4c7?q=80&w=1200&auto=format&fit=crop',
          credit: 'Andrey Matveev / Unsplash',
        },
        { tag: 'Agents', date: 'Jun 2026', title: 'Teaching a model to wait', body: 'Most agent failures aren\u2019t bad actions \u2014 they\u2019re acting one turn too early.', color: '#7c6af7' },
        { tag: 'Systems', date: 'Mar 2026', title: 'The rewrite nobody asked for', body: 'Why the tool-calling pipeline got simpler twice in one quarter, and what broke each time.', color: '#00d9a8' },
      ];

      return (
        <section id="lab" className="relative py-24 md:py-32 px-5 sm:px-8 border-t border-white/[0.06] bg-[#0a120d] overflow-hidden">
          <div className="relative z-10 max-w-6xl mx-auto">
            <Reveal>
              <p className="section-num mb-4">1.5 &middot; Inside the lab</p>
            </Reveal>
            <Reveal delay={80}>
              <h2 className="h-display text-3xl sm:text-4xl md:text-5xl max-w-3xl text-white">
                Some things aren&rsquo;t built. They&rsquo;re grown.
              </h2>
            </Reveal>
            <LitText
              as="p"
              className="mt-6 max-w-2xl text-[15px] md:text-base leading-relaxed"
              text="Ava doesn't ship features so much as grow them — context taking root, memory branching outward. The graph below is the same thing seen from the systems side: a small set of active threads, not a department."
              minOpacity={0.16}
              maxOpacity={0.55}
            />

            <Reveal delay={160}>
              <div className="sylva-scene-wrap mt-14" ref={wrapRef}>
                {!ready && <div className="sylva-scene-loading">Loading the living scene&hellip;</div>}
                {shouldLoad && (
                <iframe
                  className="sylva-scene-frame"
                  src="OPEN-THIS-purple-path.html"
                  title="Ava's living memory — purple path, moss, and Ava, rendered in three.js"
                  width="100%"
                  height="100%"
                  onLoad={() => { window.setTimeout(function(){ setReady(true); }, 5000); }}
                  style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', border: 0, display: 'block', opacity: ready ? 1 : 0 }}
                />
                )}
                <div className="flora-overlay-copy">
                  <p className="text-[11.5px] uppercase tracking-wide text-white/40 font-medium">
                    Live &middot; the branch, the moss, the butterfly, and every node are rendered, not filmed
                  </p>
                </div>
              </div>
            </Reveal>

            <Reveal delay={220}>
              <div className="lab-stats mt-10">
                {stats.map((s) => (
                  <div key={s.label}>
                    <p className="lab-stat-num">{s.num}</p>
                    <p className="lab-stat-label">{s.label}</p>
                  </div>
                ))}
              </div>
            </Reveal>

            {/* Findings — wider showcase than the Research notes feed above */}
            <div className="mt-24 md:mt-28 pt-14 md:pt-16 border-t border-white/[0.06]">
              <div className="flex items-end justify-between gap-6 flex-wrap">
                <div>
                  <Reveal>
                    <p className="text-[13px] font-medium text-white/40 tracking-wide uppercase mb-2">From the lab</p>
                  </Reveal>
                  <Reveal delay={60}>
                    <h3 className="h-display text-2xl sm:text-3xl md:text-[2.25rem] max-w-xl text-white">
                      Findings, write-ups, and things that didn&rsquo;t work.
                    </h3>
                  </Reveal>
                </div>
                <Reveal delay={100}>
                  <a href="research.html" className="btn-ghost !py-2 !px-4 text-[13px] flex-shrink-0">
                    All research <Arrow />
                  </a>
                </Reveal>
              </div>

              <div className="mt-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {findings.map((f, i) => (
                  <Reveal key={f.title} delay={60 + i * 50} className={f.featured ? 'featured' : ''}>
                    <a href="research.html" className={`finding-card ${f.featured ? 'featured' : ''} ${f.img ? 'has-photo' : ''}`}>
                      {f.img ? (
                        <div className="finding-photo" style={{ backgroundImage: `url(${f.img})` }}>
                          <span className="finding-photo-tag">{f.tag}</span>
                          {f.credit && <span className="finding-photo-credit">{f.credit}</span>}
                        </div>
                      ) : (
                        <span className="finding-accent" style={{ background: f.color }} />
                      )}
                      <div className="finding-card-body">
                        {!f.img && (
                          <div className="finding-meta">
                            <span>{f.tag}</span>
                            <span className="dot" />
                            <span>{f.date}</span>
                          </div>
                        )}
                        {f.img && (
                          <div className="finding-meta" style={{ marginTop: 0 }}>
                            <span>{f.date}</span>
                          </div>
                        )}
                        <p className="finding-title">{f.title}</p>
                        <p className="finding-body">{f.body}</p>
                        <span className="finding-arrow">Read <Arrow /></span>
                      </div>
                    </a>
                  </Reveal>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }




    function Cta() {
      return (
        <section className="relative py-24 md:py-32 px-5 sm:px-8 border-t border-white/[0.06] bg-[#050505] overflow-hidden">
          <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
            <img
              src={READY_BG}
              alt=""
              className="absolute inset-0 w-full h-full object-cover object-center"
            />
            <div className="absolute inset-0 bg-[#050505]/35" />
          </div>
          <div className="relative z-10 max-w-3xl mx-auto">
            <Reveal>
              <p className="section-num mb-4 text-white/50">5 · Get started</p>
            </Reveal>
            <LitText
              as="h2"
              className="h-display text-3xl sm:text-4xl md:text-5xl max-w-xl"
              text="What do you want to talk about?"
            />
            <Reveal delay={160}>
              <p className="mt-5 text-white/50 text-[15px] md:text-base max-w-md leading-relaxed">
                Start free. No credit card. Ava is ready when you are.
              </p>
            </Reveal>
            <Reveal delay={240}>
              <div className="mt-9 flex flex-wrap items-center gap-3">
                <a href={APP.open} className="btn-primary">
                  Open Synapses <Arrow />
                </a>
                <a href={APP.avaPhone} className="btn-ghost">
                  Talk to Ava
                </a>
              </div>
            </Reveal>
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="border-t border-white/[0.06] py-10 px-5 sm:px-8">
          <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-[13px]">
            <span className="font-medium text-white/80">Synapses</span>
            <div className="flex gap-6 text-white/35">
              <a href="#research" className="hover:text-white/70 transition-colors">Research</a>
              <a href="#product" className="hover:text-white/70 transition-colors">Product</a>
              <a href="#companion" className="hover:text-white/70 transition-colors">Companion</a>
              <a href={APP.open} className="hover:text-white/70 transition-colors">Open app</a>
            </div>
            <span className="text-white/25 text-[12px]">© {new Date().getFullYear()} · Geist layout study</span>
          </div>
        </footer>
      );
    }

    function App() {
      return (
        <main>
          <Nav />
          <Research />
          <SylvaHero />
          <Hero />
          <div className="divider max-w-6xl mx-auto" />
          <Product />
          <Companion />
          <Applications />
          <Cta />
          <Footer />
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- Deep-space aurora engine — renders into #deepSpaceLayer/#deepSpaceCanvas
       inside the Companion section above. Plain JS (not Babel/JSX); binds on
       window 'load', so it's safe to load after the React root mounts. -->
  <script src="videos/aurora.js"></script>
</body>
</html>
